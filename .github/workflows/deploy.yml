name: Deploy API

# Best-practice CI/CD:
#  1. CI GATE  — build on a GitHub runner to catch breakage BEFORE prod.
#  2. DEPLOY   — SSH into the prod host and run our release-based deploy
#                script (atomic flip + migrations + health-gated rollback).
#
# Triggered on push to main that touches API code, or manually.

on:
  push:
    branches: [ main ]
    paths:
      - 'src/**'
      - 'prisma/**'
      - 'package.json'
      - 'package-lock.json'
      - 'ecosystem.config.js'
      - '.github/workflows/deploy.yml'
  workflow_dispatch: {}

concurrency:
  group: deploy-api
  cancel-in-progress: false   # never interrupt an in-flight deploy

jobs:
  # ---- 1. CI gate: prove it builds before we touch production ----
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install deps
        run: npm ci
      - name: Prisma generate
        run: npx prisma generate
        env:
          # generate only needs a syntactically valid URL, not a real DB.
          DATABASE_URL: postgresql://user:pass@localhost:5432/db
      - name: Build (typecheck + compile)
        run: npm run build

  # ---- 2. Deploy: only runs if build passed ----
  deploy:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Deploy over SSH (release-based, health-gated)
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          port: ${{ secrets.SSH_PORT }}
          key: ${{ secrets.SSH_DEPLOY_KEY }}
          command_timeout: 20m
          script: |
            set -e
            cd /root/.openclaw/workspace/arasya-projects
            GIT_SYNC=1 ./deploy-local.sh api
